<!DOCTYPE html>

    <link rel="stylesheet" href="../shared/terminal-settings-menu.css?v=14">
    <link rel="stylesheet" href="../shared/terminal-game-multiplayer-btn.css?v=1">
    <link rel="stylesheet" href="../shared/terminal-status-hint.css?v=2">
        <link rel="stylesheet" href="../shared/terminal-footer-actions.css?v=4">
    <link rel="stylesheet" href="../shared/terminal-side-panel-pro.css?v=30"><link rel="stylesheet" href="../shared/millionaire-quiz.css?v=11">

<link rel="stylesheet" href="../shared/terminal-half-btn.css?v=3">

</head>
<body class="verda-gold-body verga-gold-body">
<main class="boss-crown-page verga-gold-page">
    <section class="boss-crown-game verga-gold-game" aria-label="Millionaire Crown">
        <div class="verga-layout">
<div class="verga-reels-panel">
                <div class="verga-reels-stage">
                    <div class="verga-reels-unit">
                    <div class="verga-reels-board">
                        <section class="boss-crown-machine">
                            <div class="verga-reels-led-frame" id="vergaReelsLedFrame">
                                <div class="verga-reels-led-track" aria-hidden="true"></div>
                                <div class="verga-reels-led-inner">
                            <div class="boss-crown-reels" id="gameReels" aria-label="Role Millionaire Crown">
                        <div class="boss-crown-reel" data-reel="0">
                            <div class="boss-crown-cell" data-position="0-0"><img src="symbols/7.webp" data-symbol="om" alt=""></div>
                            <div class="boss-crown-cell" data-position="0-1"><img src="symbols/portocala.webp" data-symbol="a" alt=""></div>
                            <div class="boss-crown-cell" data-position="0-2"><img src="symbols/cireasa.webp" data-symbol="j" alt=""></div>
                        </div>
                        <div class="boss-crown-reel" data-reel="1">
                            <div class="boss-crown-cell" data-position="1-0"><img src="symbols/coroana.webp" data-symbol="scatter" alt=""></div>
                            <div class="boss-crown-cell" data-position="1-1"><img src="symbols/pruna.webp" data-symbol="k" alt=""></div>
                            <div class="boss-crown-cell" data-position="1-2"><img src="symbols/strugure.webp" data-symbol="scarabeu" alt=""></div>
                        </div>
                        <div class="boss-crown-reel" data-reel="2">
                            <div class="boss-crown-cell" data-position="2-0"><img src="symbols/lamaie.webp" data-symbol="q" alt=""></div>
                            <div class="boss-crown-cell" data-position="2-1"><img src="symbols/clopotel.webp" data-symbol="buburuza" alt=""></div>
                            <div class="boss-crown-cell" data-position="2-2"><img src="symbols/cireasa.webp" data-symbol="j" alt=""></div>
                        </div>
                        <div class="boss-crown-reel" data-reel="3">
                            <div class="boss-crown-cell" data-position="3-0"><img src="symbols/cireasa.webp" data-symbol="j" alt=""></div>
                            <div class="boss-crown-cell" data-position="3-1"><img src="symbols/pruna.webp" data-symbol="k" alt=""></div>
                            <div class="boss-crown-cell" data-position="3-2"><img src="symbols/coroana.webp" data-symbol="scatter" alt=""></div>
                        </div>
                        <div class="boss-crown-reel" data-reel="4">
                            <div class="boss-crown-cell" data-position="4-0"><img src="symbols/strugure.webp" data-symbol="scarabeu" alt=""></div>
                            <div class="boss-crown-cell" data-position="4-1"><img src="symbols/pepene.webp" data-symbol="faraon" alt=""></div>
                            <div class="boss-crown-cell" data-position="4-2"><img src="symbols/lamaie.webp" data-symbol="q" alt=""></div>
                        </div>
                            <svg class="boss-crown-payline-overlay" id="paylineOverlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
                        </div>
                                </div>
                            </div>
                        </section>

                        <div class="verga-quiz-popup is-hidden" id="vergaQuizPopup" role="dialog" aria-labelledby="vergaQuizTitle" aria-modal="true" aria-hidden="true">
                            <div class="verga-quiz-backdrop" aria-hidden="true"></div>
                            <div class="verga-quiz-panel">
                                <header class="verga-quiz-header">
                                    <div class="verga-quiz-logo">
                                        <span class="verga-quiz-badge" aria-hidden="true">?</span>
                                        <strong id="vergaQuizTitle">Vrei sa fii castigator?</strong>
                                    </div>
                                    <span class="verga-quiz-timer is-hidden" id="vergaQuizTimer" aria-live="polite">4</span>
                                    <button type="button" class="verga-quiz-close" id="vergaQuizClose" aria-label="Inchide">&times;</button>
                                </header>
                                <div class="verga-quiz-body">
                                    <p class="verga-quiz-offer-hint is-hidden" id="vergaQuizOfferHint"></p>
                                    <p class="verga-quiz-loading is-hidden" id="vergaQuizLoading">Se incarca intrebarea...</p>
                                    <div class="verga-quiz-question-wrap">
                                        <p class="verga-quiz-question" id="vergaQuizQuestion"></p>
                                    </div>
                                    <div class="verga-quiz-answers" id="vergaQuizAnswers"></div>
                                    <p class="verga-quiz-result is-hidden" id="vergaQuizResult"></p>
                                </div>
                                <footer class="verga-quiz-footer">
                                    <button type="button" class="verga-quiz-next is-hidden" id="vergaQuizNext">Intrebare noua</button>
                                </footer>
                            </div>
                        </div>
                    </div>

                    <div class="verga-reel-stops" id="reelStops">
                        <button type="button" class="verga-stop-btn" data-reel="0" disabled>
                            <span class="verga-stop-fill" aria-hidden="true"></span>
                            <span class="verga-stop-seconds">5</span>
                            <span class="verga-stop-label">STOP 1</span>
                        </button>
                        <button type="button" class="verga-stop-btn" data-reel="1" disabled>
                            <span class="verga-stop-fill" aria-hidden="true"></span>
                            <span class="verga-stop-seconds">5</span>
                            <span class="verga-stop-label">STOP 2</span>
                        </button>
                        <button type="button" class="verga-stop-btn" data-reel="2" disabled>
                            <span class="verga-stop-fill" aria-hidden="true"></span>
                            <span class="verga-stop-seconds">5</span>
                            <span class="verga-stop-label">STOP 3</span>
                        </button>
                        <button type="button" class="verga-stop-btn" data-reel="3" disabled>
                            <span class="verga-stop-fill" aria-hidden="true"></span>
                            <span class="verga-stop-seconds">5</span>
                            <span class="verga-stop-label">STOP 4</span>
                        </button>
                        <button type="button" class="verga-stop-btn" data-reel="4" disabled>
                            <span class="verga-stop-fill" aria-hidden="true"></span>
                            <span class="verga-stop-seconds">5</span>
                            <span class="verga-stop-label">STOP 5</span>
                        </button>
                    </div>
                    </div>
                </div>

                <aside class="terminal-info-pages verga-info-popup is-hidden" id="vergaInfoPopup" role="dialog" aria-modal="true" aria-label="Millionaire Crown Info">
                    <button type="button" class="terminal-info-pages__close-top" id="vergaInfoClose" aria-label="Inchide">&times;</button>
                    <div class="terminal-info-pages__viewport">
                        <div class="terminal-info-pages__track" id="vergaInfoTrack"></div>
                    </div>
                    <footer class="terminal-info-pages__footer">
                        <div class="terminal-info-pages__nav">
                            <button type="button" id="vergaInfoPrev" aria-label="Pagina anterioara">&#10094;</button>
                            <button type="button" id="vergaInfoNavClose" aria-label="Inchide">&#10005;</button>
                            <button type="button" id="vergaInfoNext" aria-label="Pagina urmatoare">&#10095;</button>
                        </div>
                        <div class="terminal-info-pages__pager" id="vergaInfoPager">Pagina 1/4</div>
                    </footer>
                </aside>
            </div>

            <aside class="verga-side-panel">
                <div class="verga-side-panel-bg" aria-hidden="true">
                    <span class="verga-side-blob verga-side-blob-1"></span>
                    <span class="verga-side-blob verga-side-blob-2"></span>
                    <span class="verga-side-blob verga-side-blob-3"></span>
                    <span class="verga-side-blob verga-side-blob-4"></span>
                </div>
<div class="verga-side-brand" aria-label="IQWIN">
                    <div class="verga-side-brand-card">
                        <img class="verga-side-brand-logo" src="../../images/logo.webp?v=7" alt="IQWIN" width="994" height="184" decoding="async">
                    </div>
                </div>

                <div class="verga-game-brand">
                    <span>Millionaire Crown</span>
                    <div class="verga-game-brand-media">
                    <img src="symbols/coroana.webp" alt="">
                    <button type="button" class="terminal-game-info-btn verga-info-btn" id="infoButton" aria-expanded="false" aria-controls="vergaInfoPopup" aria-label="Info">i</button>
                </div>
                </div>

                <div class="verga-side-stats">
                    <div class="boss-crown-balance terminal-stat-panel">
                        <div class="terminal-stat-body">
                            <div class="terminal-stat-head">
                                <span class="terminal-stat-icon terminal-stat-icon--wallet" aria-hidden="true"></span>
                                <span class="terminal-stat-label">Sold</span>
                            </div>
                            <strong class="terminal-stat-value" id="balanceValue">0,00</strong>
                            <span class="terminal-stat-lei" id="balanceLeiValue">(0,00 lei)</span>
                        </div>
                    </div>
                    <div class="boss-crown-last-win terminal-stat-panel">
                        <div class="terminal-stat-body">
                            <div class="terminal-stat-head">
                                <span class="terminal-stat-icon terminal-stat-icon--crown" aria-hidden="true"></span>
                                <span class="terminal-stat-label">Ultim castig</span>
                            </div>
                            <strong class="terminal-stat-value" id="lastWinValue">0,00</strong>
                            <span class="terminal-stat-lei" id="lastWinLeiValue">(0,00 lei)</span>
                        </div>
                    </div>
                </div>

                <div class="verga-lines-wrap">
                    <div class="verga-lines verga-lines--fixed" id="lineButtons" role="group" aria-label="Linii de plata">
                        <button type="button" data-lines="5" class="is-active" disabled aria-disabled="true"><span class="terminal-lines-icon" aria-hidden="true"></span><span class="terminal-lines-label"><span class="terminal-lines-num">5</span> <span class="terminal-lines-word">LINII FIXED</span></span></button>
                    </div>
                    <div class="terminal-speed-inline is-speed-hidden">
                        <div class="terminal-speed-bar" id="terminalSpeedBar" hidden aria-hidden="true"></div>
                        <button type="button" class="terminal-game-multiplayer-btn" id="gameMultiplayerBtn" hidden aria-label="Multiplayer">
                            <span id="gameMultiplayerBtnLabel">MULTIPLAYER</span>
                        </button>
                    </div>
                </div>

                <div class="boss-crown-bet-label" id="betLabel">Seteaza valoarea si liniile, apoi apasa START</div>

                <div class="verga-bet-controls" id="betControls">
                    <div class="verga-bet-card">
                        <div class="verga-bet-actions">
                            <div class="slot-bet-row" role="group" aria-label="Selecteaza valoarea">
                                <button type="button" class="slot-bet-arrow" id="betBasePrev" aria-label="Valoare mai mica">&#10094;</button>
                                <div class="slot-bet-buttons" id="betBaseButtons"></div>
                                <button type="button" class="slot-bet-arrow" id="betBaseNext" aria-label="Valoare mai mare">&#10095;</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="verga-side-play-stack">
                <div class="verga-side-tools terminal-settings-wrap">
                    <div class="terminal-status-frame is-idle" id="terminalStatusFrame" aria-live="polite">
                        <span class="terminal-status-text" id="terminalStatusText">Apasa START pentru a incepe</span>
                    </div>
                </div>

                <div class="verga-spin-wrap">
                    <div class="verga-spin-stage">
                        <div class="verga-spin-stage-side" aria-hidden="true"></div>
                        <button class="boss-crown-spin" type="button" id="spinButton" aria-label="Start">
                            <span class="verga-spin-label" aria-hidden="true">PLAY</span>
                            <span class="verga-spin-play-icon" aria-hidden="true"></span>
                            <strong class="verga-stop-all-label">
                                <span class="verga-stop-all-line">Opreste</span>
                                <span class="verga-stop-all-line">toate</span>
                            </strong>
                        </button>
                        <button type="button" class="verga-half-btn is-hidden" id="halfButton" aria-label="Quiz recuperare 50%" disabled>
                            <span class="verga-half-btn-icon" aria-hidden="true">
                                <img src="../shared/half-lifeline-icon.svg" alt="" width="32" height="32" decoding="async">
                            </span>
                        </button>
                    </div>
                </div>
                <div class="verga-side-footer-actions terminal-game-footer">
                    <button type="button" class="terminal-game-home-btn" id="gameHomeBtn" aria-label="Pagina Jocuri">
                        <svg class="terminal-game-home-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M12 3L2 12h2v9h6v-6h4v6h6v-9h2L12 3z"/>
                        </svg>
                        <span>Pagina Jocuri</span>
                    </button>
                                        <div class="terminal-footer-volume">
                        <button type="button" class="terminal-volume-toggle" id="terminalVolumeToggle" aria-expanded="false" aria-controls="terminalVolumePopover" aria-label="Volum sunet">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03z"/></svg>
                        </button>
                        <div class="terminal-volume-popover" id="terminalVolumePopover" hidden>
                            <div class="terminal-settings-volume-row">
                                <input type="range" class="terminal-settings-volume-slider" id="terminalVolumeSlider" min="0" max="100" value="100" aria-label="Nivel volum">
                                <span class="terminal-settings-volume-value" id="terminalVolumeValue">100</span>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="terminal-game-cashout-btn" id="gameCashOutBtn" aria-label="Sold Out">
                        <span>Sold Out</span>
                        <svg class="terminal-game-cashout-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h3l-4 4-4-4h3V7z"/>
                        </svg>
                    </button>
                </div>
                </div>
            </aside>
        </div>
    </section>
